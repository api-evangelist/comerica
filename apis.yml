description: >-
  Comerica Incorporated is a Texas-headquartered super-regional financial
  services holding company providing retail, small-business, commercial, and
  wealth-management banking across the United States, with market concentrations
  in Texas, California, Michigan, Arizona, and Florida. As of July 2026 Comerica
  publishes NO first-party developer API portal: developer.comerica.com,
  api.comerica.com, and related developer subdomains do not resolve, and
  directory trackers (Open Banking Tracker, API Tracker) list no documented API
  products, OpenAPI/Swagger specs, SDKs, or Postman collections. Consumer and
  small-business account data is reached indirectly through US open-finance
  aggregators (Plaid, MX, Finicity, Akoya) and through Financial Data Exchange
  (FDX) APIs — the CFPB-recognized standard-setting body for the Section 1033
  Personal Financial Data Rights rule — rather than a Comerica-published
  endpoint. Commercial treasury, cash-positioning, ACH/wire initiation, and
  reporting are delivered through Comerica's Cash Management and Commercial
  Information Management platforms under direct customer contract (host-to-host
  files, portal, and BAI/ISO 20022 feeds), not a public REST API. Note: Fifth
  Third Bancorp completed its all-stock acquisition of Comerica in February
  2026, so Comerica's future digital and API surface is being integrated into
  Fifth Third's platform.
